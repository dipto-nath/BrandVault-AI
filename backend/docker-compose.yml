version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: brandvault
      POSTGRES_USER: brandvault
      POSTGRES_PASSWORD: brandvault
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./alembic:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandvault"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+asyncpg://brandvault:brandvault@postgres:5432/brandvault
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      USE_MOCK_LLM: "false"
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app
      - ./uploads:/app/uploads

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql+asyncpg://brandvault:brandvault@postgres:5432/brandvault
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      USE_MOCK_LLM: "false"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./app:/app
      - ./uploads:/app/uploads

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://brandvault:brandvault@postgres:5432/brandvault
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./app:/app

volumes:
  postgres_data:
  redis_data: