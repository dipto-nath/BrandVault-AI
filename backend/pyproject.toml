[project]
name = "brandvault-backend"
version = "1.0.0"
description = "BrandVault AI Backend - Brand Governance Platform"
requires-python = ">=3.11"

[tool.poetry]
package-mode = false
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "sqlalchemy==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "pgvector==0.2.5",
    "pydantic==2.7.4",
    "pydantic-settings==2.3.3",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.9",
    "celery==5.4.0",
    "redis==5.0.1",
    "google-generativeai==0.8.0",
    "openai==1.30.1",
    "httpx==0.27.0",
    "PyMuPDF==1.23.26",
    "python-docx==1.1.0",
    "tiktoken==0.7.0",
    "python-dotenv==1.0.1",
    "structlog==24.1.0",
    "pytz==2024.1",
    "email-validator==2.1.0.post1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "faker==30.1.0",
]

[tool.uvicorn]
app = "app.main:app"
host = "0.0.0.0"
port = 8000
reload = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"